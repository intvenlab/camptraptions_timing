id: SC-09-SEQUENCE-CAP
scenario: SC-09
description: Additional FP rejected at MaxSequenceCount cap
tags: [core, cap]
parameters: { enabled: 1, FrameCount: 2, MaxSequenceCount: 1, fpAfterMaxSequenceCountPolicy: 0, wakeHalfPressHoldTime: 10s }
fixture: { captureAfterLastStimulusMs: 12000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active }
  - { atMs: 1000, signal: FP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 5000, signal: FP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 7000, signal: HP_IN_STIM, state: inactive }
expect:
  fpOut: { pulseCount: 2, frameSpacingMs: 1000 }
  telemetryDeltas:
    acceptedFpCount: 1
    rejectedFpAtSequenceCapCount: 1
metrics: [sequenceCount, ignoredFpCount]
