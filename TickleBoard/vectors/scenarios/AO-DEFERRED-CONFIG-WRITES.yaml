id: AO-DEFERRED-CONFIG-WRITES
scenario: ADDON-DEFERRED-CONFIG
description: Write config during active flow and verify defer/reject behavior
tags: [addon, config-write]
parameters: { enabled: 1, FrameCount: 4, StartFrameSpacingMin: 1.0s }
fixture: { captureAfterLastStimulusMs: 9000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 1000, signal: FP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 4, frameSpacingMs: 1000 }
  telemetryDeltas:
    acceptedFpCount: 1
metrics: [frameCount]
