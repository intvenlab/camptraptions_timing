id: SC-04-WAKE-TIMEOUT
scenario: SC-04
description: HP only path should timeout with no FP
tags: [core, wake-only]
parameters: { enabled: 1, wakeHalfPressHoldTime: 10s }
fixture: { captureAfterLastStimulusMs: 12000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 0 }
  timing:
    wakeOnlyHoldMs: { targetMs: 10000 }
  telemetryDeltas:
    wakeTimeoutCount: 1
metrics: [wakeOnlyHoldMs, hpInToHpOutLatencyMs]
