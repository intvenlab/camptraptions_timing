id: AO-LATENCY-HP-IN-TO-HP-OUT
scenario: ADDON-LATENCY
description: Measure HP_IN to HP_OUT assertion latency under suite runtime conditions
tags: [addon, latency, hp]
parameters: { enabled: 1, FrameCount: 1, wakeHalfPressHoldTime: 3s }
fixture: { captureAfterLastStimulusMs: 1500 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
expect:
  timing:
    hpInToHpOutLatencyMs: { minMs: 0, maxMs: 200 }
metrics: [hpInToHpOutLatencyMs]
