id: SC-08-FP-BEFORE-HP
scenario: SC-08
description: FP before HP then later HP should keep cold path stable
tags: [core, cold-fp]
parameters: { enabled: 1, minHalfPressBeforeShutter: 0.5s }
fixture: { captureAfterLastStimulusMs: 9000 }
stimulus:
  - { atMs: 0, signal: FP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 200, signal: HP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 4, frameSpacingMs: 1000 }
  timing:
    firstFrameGateDelayMs: { minMs: 450, maxMs: 650 }
  telemetryDeltas:
    coldFpSequenceCount: 1
metrics: [firstFrameAfLeadMs, frameStartSpacingMs]
