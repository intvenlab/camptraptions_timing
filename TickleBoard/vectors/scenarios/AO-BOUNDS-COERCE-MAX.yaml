id: AO-BOUNDS-COERCE-MAX
scenario: ADDON-BOUNDS-COERCE
description: Verify 30000ms upper-bound coercion for shutterPulseDuration and StartFrameSpacingMin
tags: [addon, bounds, coercion]
requiresBle: true
parameters:
  enabled: 1
  wakeHalfPressHoldTime: 10s
  minHalfPressBeforeShutter: 0.5s
  shutterPulseDuration: 40s
  StartFrameSpacingMin: 40s
  PostShutterHalfPressHoldTimeExtension: 2.0s
  FrameCount: 1
  MaxSequenceCount: 4
  fullPressIgnoreGap: 35s
fixture:
  captureAfterLastStimulusMs: 8000
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 1000, signal: FP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut:
    pulseCount: 1
  telemetryDeltas:
    acceptedFpCount: 1
metrics:
  - frameCount
