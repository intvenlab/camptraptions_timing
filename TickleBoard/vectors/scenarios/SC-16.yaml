id: SC-16-HP-RELEASE-AFTER-FP
scenario: SC-16
description: HP release after FP should not drop HP_OUT continuity
tags: [core, hp-continuity]
parameters: { enabled: 1, wakeHalfPressHoldTime: 10s, minHalfPressBeforeShutter: 0.5s, PostShutterHalfPressHoldTimeExtension: 2.0s }
fixture: { captureAfterLastStimulusMs: 12000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 100, signal: FP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 4, frameSpacingMs: 1000 }
  holdExpect:
    noHpReleaseBeforeFinalFrame: true
    requirePostFinalFrameHpRelease: true
    dropTimeRule:
      wakeHoldMs: 10000
      postFinalFrameHoldMs: 2000
  timing:
    firstFrameGateDelayMs: { minMs: 450, maxMs: 650 }
metrics: [hpOutContinuityMs, firstFrameGateDelayMs]
