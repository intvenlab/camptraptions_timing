id: AO-FACTORY-RESET-AND-COERCION
scenario: ADDON-FACTORY-RESET
description: Verify factory reset behavior and reserved field coercion
tags: [addon, reset, coercion]
parameters:
  enabled: 1
  inputActivePolarity: 1
  outputDriveMode: 1
  activityHalfPressHoldPolicy: 1
fixture: { captureAfterLastStimulusMs: 8000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
  - { atMs: 1000, signal: FP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 4, frameSpacingMs: 1000 }
  telemetryDeltas:
    acceptedFpCount: 1
metrics: [frameCount]
