id: SC-12-HP-ONLY-MIN-GAP
scenario: SC-12
description: HP-only no-sequence behavior at field-like stimulus
tags: [core, wake-only]
parameters: { enabled: 1, wakeHalfPressHoldTime: 10s }
fixture: { captureAfterLastStimulusMs: 12000 }
stimulus:
  - { atMs: 0, signal: HP_IN_STIM, state: active, durationMs: 100 }
expect:
  fpOut: { pulseCount: 0 }
  timing:
    wakeOnlyHoldMs: { targetMs: 10000 }
  telemetryDeltas:
    wakeTimeoutCount: 1
metrics: [wakeOnlyHoldMs, sequenceCount]
